<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE CLOSET</title>
    <link rel="stylesheet" href="style.css">


    <style>
       body {
    margin: 0;
    background: #343943 !important;
    color: #d0d1d3;
    font-family: Arial, sans-serif;
}

.shop-header,
.products-page {
    background: #343943 !important;
    color: #d0d1d3;
}

        .shop-header {
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #777b82;
        }

        .shop-header h1 {
            font-size: 28px;
            letter-spacing: 3px;
            margin: 0;
        }

        .products-page {
            min-height: calc(100vh - 76px);
            text-align: center;
            padding: 70px 20px;
        }

        .products-page h2 {
            font-size: 30px;
            letter-spacing: 4px;
            margin-bottom: 25px;
        }

        .coming-soon {
            color: #bfc1c5;
            font-size: 15px;
            letter-spacing: 3px;
            margin-top: 100px;
        }
        .bag-panel {
    display: none;
    position: fixed;
    top: 0;
    right: 0;
    width: 400px;
    max-width: 100%;
    height: 100vh;
    background: #343943;
    color: #d0d1d3;
    z-index: 1000;
    padding: 25px;
    box-shadow: -5px 0 20px rgba(0,0,0,0.3);
    overflow-y: auto;
}

.bag-panel.open {
    display: flex;
    flex-direction: column;
}

.bag-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #777b82;
    padding-bottom: 15px;
}

.bag-header button {
    background: none;
    border: none;
    color: #d0d1d3;
    font-size: 28px;
    cursor: pointer;
}

#bag-items {
    flex: 1;
    padding: 25px 0;
}

.bag-footer {
    border-top: 1px solid #777b82;
    padding-top: 20px;
}

#checkout-button {
    width: 100%;
    padding: 15px;
    background: #d0d1d3;
    color: #343943;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

#checkout-button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.bag-button {
    position: absolute;
    right: 25px;
    background: transparent;
    color: #d0d1d3;
    border: 1px solid #777b82;
    padding: 10px 16px;
    cursor: pointer;
}
    </style>
</head>

<body>

   <header class="shop-header">
    <h1>THE CLOSET</h1>
    <button class="bag-button" onclick="openBag()">
        BAG (<span id="bag-count">0</span>)
    </button>
</header>

    <main class="products-page">
        <h2 id="category-title">COLLECTION</h2>
        <p class="coming-soon">NEW COLLECTION COMING SOON</p>
    </main>
    <div id="bag-panel" class="bag-panel">
    <div class="bag-header">
        <h2>YOUR BAG</h2>
        <button onclick="closeBag()">×</button>
    </div>

    <div id="bag-items">
        <p>Your bag is empty.</p>
    </div>

    <div class="bag-footer">
        <div class="summary-line">
            <strong>Subtotal</strong>
            <strong id="bag-total">EGP 0</strong>
        </div>
       <button id="checkout-button" onclick="window.location.href='checkout.html'">
    CHECKOUT
</button>
    </div>
</div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const category = params.get("category");

        const names = {
            hoodies: "HOODIES",
            jackets: "JACKETS",
            jeans: "JEANS",
            sweatpants: "SWEATPANTS",
            essentials: "EVERYDAY ESSENTIALS"
        };

        document.getElementById("category-title").textContent =
            names[category] || "COLLECTION";
    
    function openBag() {
    document.getElementById("bag-panel").classList.add("open");
}

function closeBag() {
    document.getElementById("bag-panel").classList.remove("open");
    }
</script>
</body>
</html>
