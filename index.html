<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE CLOSET | Everyday Essentials</title>
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#343943">
</head>
<body>
  <main class="home-page">
    <section class="intro-video" aria-label="THE CLOSET introduction">
      <video id="closetIntro" class="intro-video__media" autoplay muted loop playsinline preload="metadata" poster="homepage.webp">
        <source src="closet-intro.mp4.mp4" type="video/mp4">
      </video>
      <div class="intro-video__overlay">
        <div class="intro-video__actions"><button class="intro-video__sound" id="soundToggle" type="button" aria-label="Turn sound on">SOUND OFF</button><a class="intro-video__cta" href="products.html">SHOP NOW</a></div>
      </div>
    </section>
    <nav class="home-categories" aria-label="Shop categories">
      <a href="products.html?category=hoodies">HOODIES</a>
      <a href="products.html?category=denim">DENIM</a>
      <a href="products.html?category=jackets">JACKETS</a>
      <a href="products.html?category=jeans">JEANS</a>
      <a href="products.html?category=sweatpants">SWEATPANTS</a>
      <a href="products.html?category=essentials">ESSENTIALS</a>
    </nav>
  </main>
<script>
  const introVideo = document.getElementById("closetIntro");
  const soundToggle = document.getElementById("soundToggle");
  soundToggle.addEventListener("click", async () => {
    introVideo.muted = !introVideo.muted;
    soundToggle.textContent = introVideo.muted ? "SOUND OFF" : "SOUND ON";
    soundToggle.setAttribute("aria-label", introVideo.muted ? "Turn sound on" : "Turn sound off");
    if (!introVideo.paused) return;
    try { await introVideo.play(); } catch (e) {}
  });
</script>
</body>
</html>
